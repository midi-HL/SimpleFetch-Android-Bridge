plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.deepseekhn.wbtest'
    compileSdk 34

    defaultConfig {
        applicationId "com.deepseekhn.wbtest"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // 由 sign/release/private.pem + certificate.pem 转换而来，
            // 与手环端 RPK 使用同一证书，互联通道才能建立。
            // 开发者请换成自己的 keystore。
            storeFile file('simplefetch.jks')
            storePassword 'simplefetch'
            keyAlias 'simplefetch'
            keyPassword 'simplefetch'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation platform('androidx.compose:compose-bom:2024.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // HTTP / SSE
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 小米穿戴 SDK（与手环 Vela 互联通信）
    // 请从小米 Vela 开发者文档获取此 aar 并放到 libs/
    implementation files('libs/xms-wearable-lib_1.4_release.aar')
}
